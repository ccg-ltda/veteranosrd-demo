<header id="header">
      <div class="header-left">
        <button class="mobile-menu-btn" onclick="toggleSidebar(true)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="header-title" id="page-title">Panel de control</h1>
      </div>
      <div class="header-actions">
        <select class="currency-select" id="currencySelectHeader" onchange="changeCurrency(this.value)">
          <option value="COP">$ Peso Colombiano (COP)</option>
          <option value="DOP">RD$ Peso Dominicano (DOP)</option>
          <option value="USD">$ Dólar (USD)</option>
          <option value="EUR">€ Euro (EUR)</option>
          <option value="GBP">£ Libra (GBP)</option>
        </select>
        <button class="btn btn-ghost btn-small" onclick="startTour()">&#10024; Ver demo guiada</button>
        <button class="btn btn-primary btn-small" onclick="openClienteModal()">+ Nuevo contacto</button>
      </div>
    </header>
