<section id="page-sms" class="page hidden">
        <div style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
          <div>
            <h2 class="section-title" style="margin-bottom:2px">SMS y WhatsApp</h2>
            <p class="text-muted" style="margin:0;font-size:12.5px">Plantillas y envío de campañas segmentadas</p>
          </div>
          <button class="btn btn-primary" onclick="openCampanaModal()">&#128228; Enviar campaña</button>
        </div>
        <div class="grid-2 grid-full">
          <div>
            <h3 class="section-title" style="font-size:14.5px">Plantillas SMS</h3>
            <input type="text" placeholder="Buscar plantilla..." id="searchTplSMS" oninput="renderPlantillas()" style="margin-bottom:10px">
            <div id="templatesSMS"></div>
            <button class="btn btn-ghost" style="width:100%;margin-top:4px" onclick="openTemplateModal('SMS')">+ Crear plantilla SMS</button>
          </div>
          <div>
            <h3 class="section-title" style="font-size:14.5px">Plantillas WhatsApp</h3>
            <input type="text" placeholder="Buscar plantilla..." id="searchTplWA" oninput="renderPlantillas()" style="margin-bottom:10px">
            <div id="templatesWA"></div>
            <button class="btn btn-ghost" style="width:100%;margin-top:4px" onclick="openTemplateModal('WhatsApp')">+ Crear plantilla WhatsApp</button>
          </div>
        </div>
        <div class="surface" style="margin-top:8px">
          <div style="padding:16px;border-bottom:1px solid var(--line)"><h3 class="section-title" style="margin:0">Historial de campañas</h3></div>
          <div class="table-scroll">
          <table><thead><tr><th>Fecha</th><th>Plantilla</th><th>Canal</th><th>Segmento</th><th>Enviados</th></tr></thead><tbody id="campanasTable"></tbody></table>
          </div>
        </div>
      </section>
