<section id="page-clientes" class="page hidden">
        <div class="page-tools"><div><h2 class="section-title">Solicitudes de Crédito</h2><p class="text-muted" style="margin:0;font-size:12.5px">Expediente de cada solicitante: monto, etapa, documentos e historial (datos simulados).</p></div></div>
        <div class="table-container">
          <div class="table-header">
            <div class="table-search">
              <input type="text" placeholder="Buscar por solicitante, referencia o correo..." id="searchClientes" oninput="renderClientesTable()">
              <span class="search-icon">&#128269;</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <select id="filtroEstadoCliente" style="width:auto;min-width:150px" onchange="renderClientesTable()">
                <option value="">Todos los estados</option>
                <option>Activo</option><option>Prospecto</option><option>Inactivo</option>
              </select>
              <button class="btn btn-ghost btn-small" onclick="document.getElementById('importClientesFile').click()">&#8593; Importar CSV</button>
              <input type="file" id="importClientesFile" accept=".csv" class="hidden" onchange="importClientesCSV(this.files[0])">
              <button class="btn btn-ghost btn-small" onclick="exportClientesCSV()">&#8595; Exportar CSV</button>
              <button class="btn btn-primary btn-small" onclick="openClienteModal()">+ Nuevo</button>
            </div>
          </div>
          <div class="table-scroll">
          <table id="clientesTableWrap" class="mobile-cards">
            <thead><tr><th>Institución / cuerpo</th><th>Solicitante</th><th>Correo</th><th>Etapa</th><th>Monto solicitado</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="clientesTable"></tbody>
          </table>
          </div>
        </div>
      </section>
