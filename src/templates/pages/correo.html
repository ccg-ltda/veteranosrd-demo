<section id="page-correo" class="page hidden">
        <div class="grid-2">
          <div class="surface">
            <div style="padding:16px;border-bottom:1px solid var(--line)">
              <div class="tabs" style="margin:0;border:none">
                <button class="tab active" id="tabRecibidos" onclick="switchCorreoTab('recibidos')">Recibidos</button>
                <button class="tab" id="tabEnviados" onclick="switchCorreoTab('enviados')">Enviados</button>
              </div>
              <div class="table-search" style="max-width:100%;margin-top:10px">
                <input type="text" placeholder="Buscar por remitente o asunto..." id="searchCorreo" oninput="renderCorreoRecibidos();renderCorreoEnviados()">
                <span class="search-icon">&#128269;</span>
              </div>
            </div>
            <div id="emailRecibidos"></div>
            <div id="emailEnviados" class="hidden"></div>
          </div>
          <div class="surface">
            <div style="padding:16px;border-bottom:1px solid var(--line)"><h3 class="section-title" style="margin:0">Acciones rápidas</h3></div>
            <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
              <button class="btn btn-primary" style="width:100%" onclick="openCorreoModal()">&#9993; Enviar correo</button>
              <div class="surface-2" style="padding:12px;font-size:12px;color:var(--ink-600)">
                <strong>Vinculación automática:</strong> si el destinatario coincide con un contacto registrado, el correo queda anotado en su ficha.
              </div>
            </div>
          </div>
        </div>
      </section>
