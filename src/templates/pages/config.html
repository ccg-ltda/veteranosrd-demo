<section id="page-config" class="page hidden">
        <div style="margin-bottom:18px">
          <h2 class="section-title" style="margin-bottom:2px">Configuración</h2>
          <p class="text-muted" style="margin:0;font-size:12.5px">Usuarios, roles y preferencias del sistema</p>
        </div>
        <div class="surface" style="padding:18px;margin-bottom:20px">
          <h3 class="section-title" style="font-size:14.5px">Preferencias del sistema</h3>
          <div class="form-group" style="max-width:320px">
            <label>Moneda predeterminada</label>
            <select id="currencySelectConfig" onchange="changeCurrency(this.value)">
              <option value="DOP">RD$ Peso Dominicano (DOP)</option>
              <option value="COP">$ Peso Colombiano (COP)</option>
              <option value="USD">$ Dólar (USD)</option>
              <option value="EUR">€ Euro (EUR)</option>
              <option value="GBP">£ Libra (GBP)</option>
            </select>
            <div class="form-hint">Los valores se registran internamente en COP; esta preferencia solo cambia cómo se visualizan (tasa referencial, no en tiempo real).</div>
          </div>
        </div>
        <div class="table-container">
          <div class="table-header">
            <div class="table-search">
              <input type="text" placeholder="Buscar usuario..." id="searchUsuarios" oninput="renderUsuariosTable()">
              <span class="search-icon">&#128269;</span>
            </div>
            <button class="btn btn-primary btn-small" onclick="openUsuarioModal()">+ Nuevo usuario</button>
          </div>
          <div class="table-scroll">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="usuariosTable"></tbody>
          </table>
          </div>
        </div>
      </section>
