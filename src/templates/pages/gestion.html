<section id="page-gestion" class="page hidden">
        <span class="title-pill">&#128222; Gestión de Llamadas</span>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px">
          <div>
            <h2 class="section-title" style="margin-bottom:2px">Historial de gestiones</h2>
            <p class="text-muted" style="margin:0;font-size:12.5px" id="gestionCount">0 gestiones &middot; filtradas</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-small" onclick="exportGestionesCSV()">&#8595; Exportar CSV</button>
            <button class="btn btn-primary" id="btnNuevaGestion" onclick="openGestionModal()">+ Nueva gestión</button>
          </div>
        </div>
        <div class="table-search" style="max-width:340px;margin-bottom:14px">
          <input type="text" placeholder="Buscar por empresa, contacto o asesor..." id="searchGestion" oninput="renderGestionTable()">
          <span class="search-icon">&#128269;</span>
        </div>
        <div class="filter-pills" id="filterPills"></div>
        <div class="table-container">
          <div class="table-scroll">
          <table id="gestionTableWrap" class="mobile-cards">
            <thead><tr><th>Empresa</th><th>Contacto</th><th>Estado</th><th>Producto</th><th>Canal</th><th>Próx. fecha</th><th>Asesor</th><th>Detalle</th><th>Acc.</th></tr></thead>
            <tbody id="gestionTable"></tbody>
          </table>
          </div>
        </div>
      </section>
